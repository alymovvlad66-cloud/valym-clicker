<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VALYM.CLIKER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{--bg:#070910;--card:rgba(20,26,42,.72);--stroke:rgba(120,160,255,.14);--txt:#e8eefc;--dim:#8b9ac0;
--cy:#00e5ff;--mg:#ff2d78;--gd:#ffc93c;--gr:#3ddc84;--pu:#a855f7;--rd:#ff4d4d;
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
html,body{height:100%;overflow:hidden;position:fixed;inset:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;overscroll-behavior:none}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgfx::before{content:'';position:absolute;inset:-30%;background:radial-gradient(circle at 20% 15%,rgba(0,229,255,.16),transparent 42%),radial-gradient(circle at 82% 78%,rgba(255,45,120,.16),transparent 45%),radial-gradient(circle at 55% 45%,rgba(168,85,247,.12),transparent 50%);animation:bgdrift 22s ease-in-out infinite alternate}
@keyframes bgdrift{100%{transform:translate(-4%,3%) scale(1.12)}}
#bgfx::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(120,180,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,255,.045) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 78%);mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 78%)}
#app{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
#hud{padding:calc(var(--safe-t) + 8px) 12px 10px;flex:0 0 auto;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:linear-gradient(180deg,rgba(10,14,24,.94),rgba(10,14,24,.6));border-bottom:1px solid var(--stroke);z-index:20}
.hud-top{display:flex;align-items:center;gap:10px}
.hud-money{flex:1;min-width:0}
.hud-money .lbl{font-size:11px;letter-spacing:2px;color:var(--cy);font-weight:900;text-shadow:0 0 12px rgba(0,229,255,.6)}
.hud-money .val{font-size:24px;font-weight:900;letter-spacing:-.5px;color:#fff;text-shadow:0 0 16px rgba(0,229,255,.55);display:flex;align-items:center;gap:6px;line-height:1.1}
.hud-money .val .cur{color:var(--cy);font-size:18px}
.hud-lvl{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,229,255,.16),rgba(168,85,247,.16));border:1px solid var(--stroke);border-radius:14px;padding:6px 12px;min-width:64px}
.hud-lvl b{font-size:19px;line-height:1}
.hud-lvl span{font-size:8.5px;color:var(--dim);letter-spacing:1px;font-weight:700}
.hud-icons{display:flex;gap:8px}
.icon-btn{width:46px;height:46px;border-radius:13px;border:1px solid var(--stroke);background:rgba(255,255,255,.045);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:.15s;color:var(--txt);position:relative}
.icon-btn:active{transform:scale(.9);background:rgba(0,229,255,.15)}
.icon-btn.menu{background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(168,85,247,.2));border-color:rgba(0,229,255,.4)}
.xpbar{margin-top:8px;height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--cy),var(--pu));transition:width .35s cubic-bezier(.2,.9,.3,1);box-shadow:0 0 12px rgba(0,229,255,.7)}
.hud-stats{display:flex;gap:6px;margin-top:8px}
.stat{flex:1;background:rgba(255,255,255,.045);border:1px solid var(--stroke);border-radius:11px;padding:7px 8px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;min-width:0;min-height:38px}
.stat .e{font-size:14px}
.stat .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.rep .t{color:var(--gd)}.stat.ene .t{color:var(--cy)}.stat.vip .t{color:var(--pu)}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 12px 24px;position:relative}
#screen::-webkit-scrollbar{width:0}
.screen{display:none;animation:fadeUp .3s ease}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:20px;padding:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-bottom:12px;position:relative;overflow:hidden}
.card.glow::before{content:'';position:absolute;inset:0;border-radius:20px;pointer-events:none;box-shadow:inset 0 0 30px rgba(0,229,255,.09)}
.sect-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;letter-spacing:1.6px;color:var(--dim);margin:10px 2px;text-transform:uppercase}
.sect-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--stroke),transparent)}
.btn{border:none;border-radius:14px;padding:14px 18px;font-weight:900;font-size:14px;cursor:pointer;transition:.15s;font-family:inherit;letter-spacing:.4px;color:#04121a;min-height:48px;display:inline-flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,var(--cy),#4be0ff);box-shadow:0 6px 20px -8px rgba(0,229,255,.9)}
.btn:active{transform:scale(.96)}
.btn.gold{background:linear-gradient(135deg,var(--gd),#ffdd7a);box-shadow:0 6px 20px -8px rgba(255,201,60,.9);color:#221800}
.btn.pink{background:linear-gradient(135deg,var(--mg),#ff6ba3);color:#fff;box-shadow:0 6px 20px -8px rgba(255,45,120,.9)}
.btn.purple{background:linear-gradient(135deg,var(--pu),#c98bff);color:#fff;box-shadow:0 6px 20px -8px rgba(168,85,247,.9)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--txt);box-shadow:none}
.btn.dis,.btn:disabled{opacity:.35;filter:grayscale(.7);pointer-events:none}
.btn.sm{padding:11px 14px;font-size:13px;border-radius:12px;min-height:44px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid var(--stroke);color:var(--dim)}
.pill.cy{color:var(--cy);border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.1)}
.pill.gd{color:var(--gd);border-color:rgba(255,201,60,.4);background:rgba(255,201,60,.1)}
.pill.mg{color:var(--mg);border-color:rgba(255,45,120,.4);background:rgba(255,45,120,.1)}
.pill.pu{color:var(--pu);border-color:rgba(168,85,247,.4);background:rgba(168,85,247,.1)}
.pill.gr{color:var(--gr);border-color:rgba(61,220,132,.4);background:rgba(61,220,132,.1)}
.prog{height:10px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--cy),var(--pu));transition:width .3s ease;box-shadow:0 0 10px rgba(0,229,255,.5)}
#clickerWrap{display:flex;flex-direction:column;align-items:center;margin:6px 0 12px;position:relative}
#clickZone{position:relative;width:min(80vw,320px);aspect-ratio:5/6;display:flex;align-items:center;justify-content:center;cursor:pointer}
#clickZone .halo{position:absolute;inset:2%;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,.3),rgba(168,85,247,.12) 45%,transparent 68%);animation:halo 3.4s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.08);opacity:1}}
#hero{width:88%;height:88%;position:relative;z-index:3;transition:transform .07s ease-out;filter:drop-shadow(0 12px 34px rgba(0,229,255,.42))}
#clickZone.press #hero{transform:scale(.94)}
#clickZone.crit #hero{transform:scale(1.08);filter:drop-shadow(0 0 46px rgba(255,201,60,1))}
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.float-num{position:absolute;font-weight:900;font-size:22px;color:#fff;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 18px rgba(0,229,255,.8);animation:floatUp 1s cubic-bezier(.2,.8,.3,1) forwards}
.float-num.crit{font-size:32px;color:var(--gd);text-shadow:0 2px 14px #000,0 0 26px rgba(255,201,60,1)}
@keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}18%{transform:translate(-50%,-70%) scale(1.22);opacity:1}100%{transform:translate(-50%,-190%) scale(.9);opacity:0}}
.par{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:parFly .72s ease-out forwards}
@keyframes parFly{100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.1);opacity:0}}
.perclick{display:flex;gap:8px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.statbox{background:var(--card);border:1px solid var(--stroke);border-radius:14px;padding:10px 16px;text-align:center;min-width:130px}
.statbox .k{font-size:10px;color:var(--dim);letter-spacing:1.1px;font-weight:800}
.statbox .v{font-size:17px;font-weight:900;color:var(--cy);margin-top:2px}
.statbox .v.g{color:var(--gr)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:14px 13px;margin-bottom:10px;position:relative;overflow:hidden;min-height:80px}
.item:active{transform:scale(.985)}
.item .thumb{width:62px;height:62px;flex:0 0 auto;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(135deg,rgba(0,229,255,.14),rgba(168,85,247,.14));border:1px solid var(--stroke);overflow:hidden}
.item .info{flex:1;min-width:0}
.item .nm{font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .ds{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.35}
.item.owned{border-color:rgba(61,220,132,.4);background:linear-gradient(135deg,rgba(61,220,132,.1),var(--card))}
.item .act{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.art{width:100%;height:100%;display:block}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:16px;padding:5px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:12px 14px;border-radius:12px;border:none;background:transparent;color:var(--dim);font-weight:900;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;min-height:44px}
.tab.active{background:linear-gradient(135deg,rgba(0,229,255,.9),rgba(75,224,255,.9));color:#04121a;box-shadow:0 5px 16px -7px rgba(0,229,255,.95)}
.plate{display:inline-flex;align-items:stretch;background:linear-gradient(180deg,#fff,#dfe4ea);border:2.5px solid #0e1118;border-radius:7px;overflow:hidden;font-family:'Arial Narrow',Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.55);color:#0e1118}
.plate .pl-l{width:14%;min-width:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1.5px solid #0e1118;font-size:7px;font-weight:800;padding:2px 1px}
.plate .pl-l .flag{width:13px;height:7px;margin-bottom:2px;border:1px solid #0e1118;background:linear-gradient(180deg,#fff 33%,#0039a6 33% 66%,#d52b1e 66%)}
.plate .pl-m{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:5px 8px;font-weight:900;letter-spacing:1.2px;font-size:17px;white-space:nowrap;font-family:'Courier New',monospace}
.plate .pl-r{width:15%;min-width:22px;display:flex;align-items:center;justify-content:center;border-left:1.5px solid #0e1118;font-weight:900;font-size:13px;padding:2px}
.plate.big .pl-m{font-size:26px;padding:9px 14px;gap:10px}.plate.big .pl-r{font-size:19px}.plate.big .pl-l{font-size:9px}
.plate.big .pl-l .flag{width:17px;height:9px}.plate.sm .pl-m{font-size:13px;gap:4px;padding:4px 6px}.plate.sm .pl-r{font-size:11px}
.r-common{box-shadow:0 4px 14px rgba(0,0,0,.55)}
.r-uncommon{box-shadow:0 0 16px rgba(61,220,132,.75),0 4px 14px rgba(0,0,0,.55)}
.r-rare{box-shadow:0 0 20px rgba(0,120,255,.9),0 4px 14px rgba(0,0,0,.55)}
.r-epic{box-shadow:0 0 26px rgba(168,85,247,1),0 4px 14px rgba(0,0,0,.55)}
.r-legendary{box-shadow:0 0 32px rgba(255,201,60,1),0 4px 14px rgba(0,0,0,.55);animation:legGlow 1.6s ease-in-out infinite}
@keyframes legGlow{50%{box-shadow:0 0 46px rgba(255,201,60,1),0 4px 14px rgba(0,0,0,.55)}}
.r-unique{box-shadow:0 0 40px rgba(255,45,120,1),0 0 70px rgba(0,229,255,.7);animation:uniqGlow 1.2s linear infinite}
@keyframes uniqGlow{100%{filter:hue-rotate(360deg)}}
.roulette-box{background:linear-gradient(160deg,rgba(0,229,255,.1),rgba(168,85,247,.1));border:1px solid rgba(0,229,255,.3);border-radius:22px;padding:18px 14px;text-align:center;position:relative;overflow:hidden}
.roulette-box::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);animation:sweep 3s linear infinite}
@keyframes sweep{to{left:200%}}
#spinDisplay{min-height:90px;display:flex;align-items:center;justify-content:center;margin:12px 0}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:7px;max-height:260px;overflow-y:auto}
.region{padding:12px 6px;border-radius:12px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:var(--txt);font-weight:900;font-size:14px;cursor:pointer;font-family:inherit;min-height:46px}
.region.active{background:linear-gradient(135deg,var(--cy),#4be0ff);color:#04121a;border-color:transparent}
.region:active{transform:scale(.93)}
.case-strip{position:relative;height:120px;overflow:hidden;border-radius:15px;background:rgba(0,0,0,.45);border:1px solid var(--stroke);margin:12px 0}
.case-strip .inner{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;gap:8px;padding:0 8px;will-change:transform}
.case-cell{flex:0 0 auto;width:98px;height:98px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px solid;font-size:10px;font-weight:800;padding:4px;text-align:center}
.case-strip .marker{position:absolute;top:0;left:50%;width:2px;height:100%;background:var(--gd);box-shadow:0 0 14px var(--gd);transform:translateX(-50%);z-index:5}
.case-strip .marker::before,.case-strip .marker::after{content:'';position:absolute;left:50%;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent}
.case-strip .marker::before{top:-1px;border-top:9px solid var(--gd)}
.case-strip .marker::after{bottom:-1px;border-bottom:9px solid var(--gd)}
.case-strip.car-strip{height:136px}
.case-strip.car-strip .case-cell{width:112px;height:112px;padding:4px 3px;justify-content:space-between}
.case-strip.car-strip .case-cell svg{width:92px;height:48px;display:block}
.case-strip.car-strip .case-cell .cbrand{font-size:8.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center}
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(3,5,10,.85);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;padding:14px;animation:fadeIn .22s ease;overflow-y:auto}
.modal-bg.show{display:flex}
@keyframes fadeIn{from{opacity:0}}
.modal{width:100%;max-width:420px;background:linear-gradient(160deg,rgba(24,31,50,.98),rgba(14,18,30,.99));border:1px solid rgba(0,229,255,.28);border-radius:24px;padding:22px 16px;text-align:center;position:relative;box-shadow:0 26px 70px -18px rgba(0,229,255,.4);animation:popIn .38s cubic-bezier(.2,1.4,.4,1);max-height:90vh;overflow-y:auto;margin:auto}
@keyframes popIn{0%{transform:scale(.7) translateY(30px);opacity:0}}
.modal h2{font-size:22px;font-weight:900;letter-spacing:1.2px;margin-bottom:8px}
.modal p{font-size:14px;color:var(--dim);line-height:1.5;margin-bottom:14px}
.modal .big-emoji{font-size:56px;line-height:1;margin-bottom:8px;animation:bounceIn .65s cubic-bezier(.2,1.5,.4,1)}
@keyframes bounceIn{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.28) rotate(9deg)}}
.modal .btns{display:flex;gap:10px;margin-top:14px}
.modal .btns .btn{flex:1}
.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.menu-item{display:flex;align-items:center;gap:10px;padding:15px 13px;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--stroke);text-align:left;font-family:inherit;color:var(--txt);min-height:56px}
.menu-item:active{transform:scale(.96)}
.menu-item.active{background:linear-gradient(135deg,rgba(0,229,255,.22),rgba(0,229,255,.06));border-color:rgba(0,229,255,.5)}
.menu-item .mi{font-size:24px}.menu-item .mt{font-size:13px;font-weight:900}
.menu-x{position:absolute;top:-10px;right:-10px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--mg),#ff6ba3);color:#fff;font-weight:900;font-size:22px;border:2px solid rgba(255,255,255,.35);cursor:pointer;box-shadow:0 6px 20px -6px rgba(255,45,120,.9);display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.menu-x:active{transform:rotate(90deg) scale(.92)}
#toasts{position:fixed;top:calc(var(--safe-t) + 6px);left:0;right:0;z-index:300;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;padding:0 12px}
.toast{background:linear-gradient(135deg,rgba(24,31,50,.98),rgba(14,18,30,.98));border:1px solid rgba(0,229,255,.4);border-radius:15px;padding:11px 15px;display:flex;align-items:center;gap:10px;max-width:400px;width:100%;box-shadow:0 12px 34px -10px rgba(0,229,255,.6);animation:toastIn .42s cubic-bezier(.2,1.3,.4,1)}
.toast.gold{border-color:rgba(255,201,60,.6)}.toast.pink{border-color:rgba(255,45,120,.6)}
.toast .ti{font-size:26px}.toast .tt{font-size:13px;font-weight:900}.toast .ts{font-size:11px;color:var(--dim);margin-top:2px}
@keyframes toastIn{0%{transform:translateY(-26px) scale(.9);opacity:0}}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastOut{to{transform:translateY(-20px) scale(.9);opacity:0}}
.conf{position:fixed;top:-20px;width:9px;height:14px;z-index:290;pointer-events:none;animation:confFall linear forwards}
@keyframes confFall{100%{transform:translateY(105vh) rotate(760deg);opacity:.15}}
#lvlFlash{position:fixed;inset:0;z-index:250;background:radial-gradient(circle,rgba(0,229,255,.28),rgba(0,0,0,.9));display:none;align-items:center;justify-content:center;pointer-events:none}
#lvlFlash.show{display:flex}
#lvlFlash .txt{font-size:clamp(38px,13vw,74px);font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,var(--cy),var(--gd),var(--mg));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:lvlPop .9s cubic-bezier(.2,1.5,.4,1);text-align:center;line-height:1}
@keyframes lvlPop{0%{transform:scale(.2) rotate(-14deg);opacity:0}55%{transform:scale(1.16) rotate(4deg);opacity:1}}
.shake{animation:shk .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,2px)}40%,60%{transform:translate(6px,-1px)}}
#tut{position:fixed;inset:0;z-index:400;background:rgba(3,5,10,.88);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
#tut.show{display:flex}
.tut-card{background:linear-gradient(160deg,rgba(24,31,50,.99),rgba(14,18,30,.99));border:1px solid rgba(0,229,255,.4);border-radius:24px;padding:26px 20px;text-align:center;max-width:380px;width:100%;box-shadow:0 26px 70px -18px rgba(0,229,255,.5)}
.tut-card .ti{font-size:58px;margin-bottom:10px}
.tut-dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.tut-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.tut-dots i.on{background:var(--cy);width:22px;border-radius:5px;box-shadow:0 0 12px var(--cy)}

/* ============ SAFE STORAGE ============ */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

/* ============ AUTH ============ */
const ACCOUNTS_KEY='valym_accounts';
const SESSION_KEY='valym_session';
const SAVE_PREFIX='valym_save_';
const OLD_SAVE_KEY='valym_cliker_v1';
let authTab='login';
let gameLoopStarted=false;

function hashPass(p){let h=5381;for(let i=0;i<p.length;i++)h=((h<<5)+h)^p.charCodeAt(i);return(h>>>0).toString(36)+p.length.toString(36);}
function getAccounts(){try{return JSON.parse(lsGet(ACCOUNTS_KEY)||'{}')||{};}catch(e){return {};}}
function saveAccounts(a){lsSet(ACCOUNTS_KEY,JSON.stringify(a));}
function getSession(){return lsGet(SESSION_KEY);}
function setSession(n){lsSet(SESSION_KEY,n);}
function clearSession(){lsDel(SESSION_KEY);}
function userSaveKey(){const n=getSession();return n?SAVE_PREFIX+n:null;}

function save(){
  try{
    const k=userSaveKey();
    if(!k)return;
    lsSet(k,JSON.stringify(S));
  }catch(e){}
}
function load(){
  try{
    const k=userSaveKey();
    if(!k)return false;
    const raw=lsGet(k);
    if(!raw)return false;
    const d=JSON.parse(raw);const base=defaultState();S=Object.assign(base,d);
    S.opt=Object.assign({sound:true},d.opt||{});S.upg=Object.assign(base.upg,d.upg||{});
    S.daily=Object.assign(base.daily,d.daily||{});
    S.boosters=d.boosters||{};S.installs=d.installs||{};S.claimed=d.claimed||{};
    S.autos=d.autos||{};S.cars=d.cars||[];S.estates=d.estates||[];
    S.plates=d.plates||[];S.achievements=d.achievements||[];
    S.casino=Object.assign({bots:1,bet:10000,wins:0,losses:0,profit:0},d.casino||{});
    S.clothing=Object.assign({inventory:[],seq:1},d.clothing||{});
    S.clothing.inventory=(S.clothing.inventory||[]).filter(x=>x&&x.slot&&x.rarity);
    return true;
  }catch(e){return false;}
}

function renderAuth(){
  const el=document.getElementById('authCard');
  if(!el)return;
  const isReg=authTab==='register';
  el.innerHTML=`
    <div class="auth-logo">VALYM.CLIKER</div>
    <div class="auth-sub">${isReg?'СОЗДАТЬ АККАУНТ':'ВОЙТИ В ИГРУ'}</div>
    <div class="auth-tabs">
      <button class="auth-tab ${!isReg?'active':''}" data-act="authTab" data-id="login">ВОЙТИ</button>
      <button class="auth-tab ${isReg?'active':''}" data-act="authTab" data-id="register">РЕГИСТРАЦИЯ</button>
    </div>
    <div class="auth-field"><label>НИКНЕЙМ</label>
      <input id="authNick" type="text" maxlength="20" autocomplete="username" placeholder="Твой ник" autocapitalize="off" spellcheck="false"></div>
    <div class="auth-field"><label>ПАРОЛЬ</label>
      <input id="authPass" type="password" autocomplete="${isReg?'new-password':'current-password'}" placeholder="• • • • • •"></div>
    ${isReg?`<div class="auth-field"><label>ПОВТОР ПАРОЛЯ</label>
      <input id="authPass2" type="password" autocomplete="new-password" placeholder="• • • • • •"></div>`:''}
    <div class="auth-err" id="authErr"></div>
    <button class="auth-btn" id="authSubmit">${isReg?'ЗАРЕГИСТРИРОВАТЬСЯ':'ВОЙТИ'}</button>
    <div class="auth-note">${isReg?'Ник: 3–20 символов (a-z, 0-9, _)<br>Пароль: минимум 4 символа':'Прогресс сохраняется для каждого аккаунта'}</div>`;
  const ni=document.getElementById('authNick');
  const pi=document.getElementById('authPass');
  const p2=document.getElementById('authPass2');
  const sb=document.getElementById('authSubmit');
  const err=document.getElementById('authErr');
  function trySubmit(){
    const nick=(ni.value||'').trim();
    const pass=pi.value||'';
    const pass2=p2?(p2.value||''):'';
    err.textContent='';
    if(isReg){
      if(!/^[A-Za-z0-9_]{3,20}$/.test(nick)){err.textContent='❌ Ник: 3–20 символов (a-z, 0-9, _)';return;}
      if(pass.length<4){err.textContent='❌ Пароль минимум 4 символа';return;}
      if(pass!==pass2){err.textContent='❌ Пароли не совпадают';return;}
      const accounts=getAccounts();
      if(accounts[nick]){err.textContent='❌ Ник уже занят';return;}
      const isFirst=Object.keys(accounts).length===0;
      accounts[nick]={pass:hashPass(pass),createdAt:Date.now()};
      saveAccounts(accounts);
      if(isFirst)migrateOldSave(nick);
      setSession(nick);
      try{SFX.play('levelup');confetti(60);}catch(e){}
      closeAuth();
      startGame();
    } else {
      if(!nick||!pass){err.textContent='❌ Заполни все поля';return;}
      const accounts=getAccounts();
      if(!accounts[nick]){err.textContent='❌ Аккаунт не найден';return;}
      if(accounts[nick].pass!==hashPass(pass)){err.textContent='❌ Неверный пароль';return;}
      setSession(nick);
      try{SFX.play('rare');confetti(40);}catch(e){}
      closeAuth();
      startGame();
    }
  }
  if(sb)sb.onclick=trySubmit;
  [ni,pi,p2].forEach(inp=>{if(!inp)return;inp.onkeydown=e=>{if(e.key==='Enter')trySubmit();};});
  setTimeout(()=>{if(ni)ni.focus();},80);
}

function xpNeeded(l){return Math.floor(80*Math.pow(l,1.9)*7);}
function boostMul(k){const t=S.boosters[k];return(t&&t>Date.now());}
function incomeMultiplier(){let m=1;m*=1+(S.upg.income-1)*.1;
if(S.skin==='gold')m*=1.05;if(S.skin==='cyber')m*=1.08;
if(boostMul('inc2'))m*=2;if(boostMul('inc3'))m*=3;return m;}
function xpMultiplier(){let m=1+(S.upg.xp-1)*.08;
S.cars.forEach(id=>{const c=CARS.find(x=>x.id===id);if(c)m*=1+c.xp/100;});
if(boostMul('xp2'))m*=2;return m;}
function autoIncome(){
  let base=0;
  S.estates.forEach(id=>{const e=ESTATES.find(x=>x.id===id);if(e)base+=e.inc*100;});
  const bizBonus=1+S.estates.length*0.06;
  return base*bizBonus*repMultiplier();
}
function businessMultiplier(){return 1+S.estates.length*0.06;}
function clothingMultiplier(){const inv=(S.clothing&&S.clothing.inventory)||[];let m=1;
inv.forEach(x=>{if(x.equipped&&CLOTH_RARITY[x.rarity])m*=CLOTH_RARITY[x.rarity].mult;});return m;}
function clickIncome(){return clickValue(S.upg.click)*incomeMultiplier()*clothingMultiplier()/5;}
function maxEnergy(){return 100+(S.upg.energy-1)*20;}
function energyRegen(){return 1+(S.upg.energy-1)*.15;}
function critChanceNow(){return Math.min(100,critChance(S.upg.crit)+(S.skin==='cyber'?5:0));}
function repMultiplier(){return 1+S.rep*.002;}

function rollRarity(pity){
const w={common:RARITY.common.w,uncommon:RARITY.uncommon.w,rare:RARITY.rare.w,epic:RARITY.epic.w,legendary:RARITY.legendary.w,unique:RARITY.unique.w};
if(pity>=10){w.rare*=1.5;w.epic*=1.3;w.legendary*=1.2;}
if(pity>=15){w.rare*=1.8;w.epic*=1.5;w.legendary*=1.4;}
if(pity>=20)w.common=0;
if(pity>=35){w.uncommon*=.3;w.rare*=2;w.epic*=2;w.legendary*=1.7;}
if(pity>=50){w.rare=0;w.epic*=3;w.legendary*=2.5;}
const total=Object.values(w).reduce((a,b)=>a+b,0);
let r=Math.random()*total;
for(const k of RARITY_ORDER){r-=w[k];if(r<=0)return k;}
return'common';}
function pickPlateLetters(r){
if(r==='unique'||r==='legendary'){const L=pick(LETTERS);return[L,L,L];}
if(r==='epic'){if(Math.random()<.7){const L=pick(LETTERS);return[L,L,L];}const L=pick(LETTERS),M=pick(LETTERS.filter(x=>x!==L));return[L,M,M];}
if(r==='rare'){if(Math.random()<.45){const L=pick(LETTERS),M=pick(LETTERS.filter(x=>x!==L));return[L,M,M];}let a=pick(LETTERS),b;do{b=pick(LETTERS);}while(b===a);return[a,b,b];}
if(r==='uncommon'){if(Math.random()<.3){const L=pick(LETTERS),M=pick(LETTERS.filter(x=>x!==L));return[L,M,M];}let a=pick(LETTERS),b=pick(LETTERS),c=pick(LETTERS);if(b===c&&Math.random()<.7)c=pick(LETTERS.filter(x=>x!==b));return[a,b,c];}
let a=pick(LETTERS),b,c;do{b=pick(LETTERS);}while(b===a);do{c=pick(LETTERS);}while(c===b&&Math.random()<.6);return[a,b,c];}
function pickPlateDigits(r){
if(r==='unique')return pick(['000','001','007','111','222','333','444','555','666','777','888','999']);
if(r==='legendary')return pick(['777','888','999','001','007','111','222','555','666']);
if(r==='epic'){if(Math.random()<.5)return pick(['111','222','333','444','555','666','777','888','999']);return pick(['123','321','456','654','789','987']);}
if(r==='rare'){if(Math.random()<.5){const d=rint(1,9);return''+d+d+d;}return pick(['123','234','345','456','567','678','789','987','876','765','654','543','432','321']);}
if(r==='uncommon'){if(Math.random()<.35){const d=rint(1,9);return''+d+d+d;}return''+rint(1,9)+rint(0,9)+rint(0,9);}
return''+rint(1,9)+rint(0,9)+rint(0,9);}
function makePlate(forcedRarity,forcedRegion){
const rarity=forcedRarity||rollRarity(S.spinPity);
const region=forcedRegion||pick(REGIONS);
const digits=pickPlateDigits(rarity);
const[la,lb,lc]=pickPlateLetters(rarity);
const combo=la+lb+lc+digits;
const meta=RARITY[rarity];
const seed=hashStr(combo+region);
let value=meta.min+seed*(meta.max-meta.min);
value*=(REGION_MULT[region]||1);
let bonus=0;
if(digits[0]===digits[1]&&digits[1]===digits[2])bonus+=.35;
if(digits==='777'||digits==='888'||digits==='999')bonus+=.4;
if(digits==='001'||digits==='007')bonus+=.25;
if(digits==='000')bonus+=.6;
if(['123','234','345','456','567','678','789','321','432','543','654','765','876','987'].includes(digits))bonus+=.15;
if(la===lb&&lb===lc)bonus+=.3;else if(la===lb||lb===lc||la===lc)bonus+=.12;
value*=1+bonus;value=Math.round(value/100)*100;
const collectible=Math.round(value*(1.15+seed*.45)/100)*100;
const tags=[];
if(digits[0]===digits[1]&&digits[1]===digits[2])tags.push('Тройной повтор');
if(digits==='777')tags.push('Три семёрки');
if(digits==='888')tags.push('Три восьмёрки');
if(digits==='999')tags.push('Три девятки');
if(digits==='001')tags.push('Зеркало');
if(digits==='007')tags.push('Агент 007');
if(digits==='000')tags.push('Нулевой');
if(['123','234','345','456','567','678','789'].includes(digits))tags.push('Последовательность');
if(['321','432','543','654','765','876','987'].includes(digits))tags.push('Обратная');
if(la===lb&&lb===lc)tags.push('Тройные буквы');
else if(la===lb||lb===lc||la===lc)tags.push('Дубль');
if(!tags.length)tags.push('Стандарт');
return{id:S.plateSeq++,l1:la,l2a:lb,l2b:lc,digits,region,combo,rarity,value,collectible,tags,ts:Date.now(),installedOn:null};}

let casinoAnim=null,casinoLast=null;
function dSum(a){return a[0]+a[1];}
function dRoll(){return rint(1,6);}
function dTwo(){return[dRoll(),dRoll()];}
function dieSVG(v){const pips={1:[[50,50]],2:[[30,30],[70,70]],3:[[30,30],[50,50],[70,70]],4:[[30,30],[70,30],[30,70],[70,70]],5:[[30,30],[70,30],[50,50],[30,70],[70,70]],6:[[30,30],[70,30],[30,50],[70,50],[30,70],[70,70]]}[v]||[];
const id='d'+v+'_'+Math.random().toString(36).slice(2,6);
return `<svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c3cdd9"/></linearGradient></defs><rect x="3" y="3" width="94" height="94" rx="18" fill="url(#${id})" stroke="#0e1118" stroke-width="3"/>${pips.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="8" fill="#0e1118"/>`).join('')}</svg>`;}
function dieHTML(v,cls){return `<div class="die-wrap ${cls||''}">${dieSVG(v)}</div>`;}
function dicePairHTML(d,c1,c2){return dieHTML(d[0],c1)+dieHTML(d[1],c2);}
function casinoRoll(){if(casinoAnim)return;
const c=S.casino;const bet=c.bet;const bots=c.bots;
if(bet<10000||bet>100000000){SFX.play('error');toast('❌','Ставка 10K–100M','','pink');return;}
if(S.money<bet){SFX.play('error');toast('❌','Мало денег','','pink');return;}
S.money-=bet;c.profit-=bet;updateHUD();save();
const playerDice=dTwo();const botsDice=Array.from({length:bots},()=>dTwo());
casinoAnim={start:Date.now(),resolveAt:Date.now()+1800,playerDice,botsDice};
casinoLast=null;renderers.casino(getScreen('casino'));
const timer=setInterval(()=>{
if(!casinoAnim){clearInterval(timer);return;}
if(Date.now()>=casinoAnim.resolveAt){clearInterval(timer);finishCasinoRoll();return;}
const pd=document.getElementById('playerDice');
if(pd)pd.innerHTML=dicePairHTML(dTwo());
for(let i=0;i<bots;i++){const bd=document.querySelector(`[data-bot="${i}"]`);
if(bd)bd.innerHTML=dicePairHTML(dTwo());}
SFX.play('spin');},75);}
function finishCasinoRoll(){if(!casinoAnim)return;
const c=S.casino,bet=c.bet,bots=c.bots;
const{playerDice,botsDice}=casinoAnim;
let rolls=[{idx:0,dice:[...playerDice]}];
for(let i=0;i<bots;i++)rolls.push({idx:i+1,dice:[...botsDice[i]]});
for(let a=0;a<30;a++){
let ms=0;
for(const r of rolls)if(dSum(r.dice)>ms)ms=dSum(r.dice);
const leaders=rolls.filter(r=>dSum(r.dice)===ms);
if(leaders.length===1){rolls=leaders;break;}
rolls=leaders.map(l=>({idx:l.idx,dice:dTwo()}));}
const winner=rolls[0].idx;
const fp=(rolls.find(r=>r.idx===0)||{dice:playerDice}).dice;
const fb=[];
for(let i=0;i<bots;i++){const r=rolls.find(x=>x.idx===i+1);fb.push(r?r.dice:botsDice[i]);}
let payout=0;
if(winner===0){payout=bet*bots;S.money+=bet+payout;S.totalEarned+=payout;c.wins++;c.profit+=payout;
SFX.play('rare');confetti(payout>=1e6?110:60);if(payout>=1e6)shake();
toast('🏆','ПОБЕДА','+'+fmt(payout)+' ₽','gold');}
else{c.losses++;SFX.play('error');toast('💀','ПОРАЖЕНИЕ','Бот '+winner,'pink');}
casinoLast={playerDice:fp,botsDice:fb,winner:winner===0?'player':'bot',winnerIdx:winner-1,payout};
casinoAnim=null;updateHUD();save();
if(currentScreen==='casino')renderers.casino(getScreen('casino'));
checkAchievements();}

/* ============ GAME LOOP ============ */
let lastTick=Date.now();
let eventTimer=0;
let nextEventIn=rnd(60,100);
function gameTick(){const now=Date.now();
const dt=Math.min(1,(now-lastTick)/1000);lastTick=now;
const inc=autoIncome()*dt;
if(inc>0){S.money+=inc;S.totalEarned+=inc;S.dayEarned+=inc;
S.xp+=inc*0.0000006*xpMultiplier()/7;
let need=xpNeeded(S.level);
while(S.xp>=need&&S.level<100){S.xp-=need;S.level++;onLevelUp();need=xpNeeded(S.level);}}
if(S.energy<maxEnergy())S.energy=Math.min(maxEnergy(),S.energy+energyRegen()*dt);
if(S.activeJob&&now>=S.activeJob.end)completeJob();
if(S.activeJob){const bar=document.getElementById('jobProg');
if(bar){const total=S.activeJob.end-S.activeJob.start;const done=now-S.activeJob.start;
bar.style.width=clamp(done/total*100,0,100)+'%';}}
for(const k in S.boosters){if(S.boosters[k]<now)delete S.boosters[k];}
eventTimer+=dt;
if(eventTimer>nextEventIn){eventTimer=0;nextEventIn=rnd(65,110);randomEvent();}
if(canClaimDaily())$('#dailyDot').style.display='block';
const tk=todayKey();
if(S.lastDay!==tk){S.lastDay=tk;
S.dayClicks=0;S.dayEnergy=0;S.daySpins=0;S.dayEarned=0;
TASKS.filter(t=>t.type==='daily').forEach(t=>delete S.claimed[t.id]);}
S.rep+=0.001*dt;
if(Math.floor(now/1000)%3===0)checkAchievements();
updateHUD();
if(currentScreen==='home')updateHome();
saveTimer+=dt;
if(saveTimer>8){saveTimer=0;save();}}
function loop(){tickMoneyDisplay();requestAnimationFrame(loop);}

/* ============ START / INIT ============ */
function startGame(){
  try{
    $$('.screen').forEach(s=>s.remove());
    homeRefs=null;
    const had=load();
    if(!had){S=defaultState();S.lastDay=todayKey();}
    else S.lastDay=S.lastDay||todayKey();
    const bs=$('#btnSound');if(bs)bs.textContent=S.opt.sound?'🔊':'🔇';
    NAV.forEach(n=>getScreen(n.id));
    buildHome();
    showScreen('home');
    updateHUD();updateHome();
    if(canClaimDaily()){const dd=$('#dailyDot');if(dd)dd.style.display='block';}
    if(!had||S.tutorial<TUT_STEPS.length)setTimeout(()=>showTutorial(),500);
    bindAdminTrigger();
    lastTick=Date.now();
    if(!gameLoopStarted){
      gameLoopStarted=true;
      setInterval(gameTick,100);
      requestAnimationFrame(loop);
      document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
      window.addEventListener('beforeunload',save);
      document.addEventListener('touchstart',function once(){SFX.init();document.removeEventListener('touchstart',once);},{passive:true});
      document.addEventListener('click',function once(){SFX.init();document.removeEventListener('click',once);});
      document.addEventListener('click',e=>{
        const el=e.target.closest('[data-act="confirmset"]');
        if(!el)return;
        try{const k=userSaveKey();if(k)lsDel(k);}catch(err){}
        S=defaultState();S.lastDay=todayKey();
        S.tutorial=TUT_STEPS.length;adminUnlocked=false;
        save();closeModal();showScreen('home');
        updateHUD();updateHome();
        toast('♻️','ПРОГРЕСС СБРОШЕН','Заново!','pink');
      });
    }
  }catch(e){
    console.error('startGame error:',e);
    alert('Ошибка запуска игры: '+e.message);
  }
}

function init(){
  try{
    const session=getSession();
    const accounts=getAccounts();
    if(session&&accounts[session]){
      startGame();
      return;
    }
  }catch(e){
    console.error('init session error:',e);
  }
  try{
    openAuth();
  }catch(e){
    console.error('init auth error:',e);
    try{
      const gNick='guest_'+Math.random().toString(36).slice(2,8);
      setSession(gNick);
      const accounts=getAccounts();
      accounts[gNick]={pass:hashPass('guest'),createdAt:Date.now()};
      saveAccounts(accounts);
      startGame();
    }catch(e2){
      alert('Критическая ошибка: '+e2.message);
    }
  }
}

try{init();}catch(e){console.error('Bootstrap error:',e);alert('Ошибка: '+e.message);}
</script>
